volumes:
  shared-data:

services:
  blockchain:
    build: ./blockchain
    ports:
      - "8545:8545"
    environment:
      - DEPLOYMENTS_PATH=/shared/deployments.json
    volumes:
      - shared-data:/shared
  
  contract-setup:
    build: ./blockchain
    command: npm run setup:local
    environment:
      - RPC_URL=http://blockchain:8545
      - DEPLOYMENTS_PATH=/shared/deployments.json
      - FRONTEND_ASSETS_PATH=/shared
      - BACKEND_ARTIFACTS_PATH=/shared/artifacts
    volumes:
      - shared-data:/shared

  wot-network:
    build: ./backend
    command: npm run start:wot
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"

  api:
    build: ./backend
    command: npm run start:api
    ports:
      - "3000:3000"
    environment:
      - NETWORK=localhost
      - RPC_URL=http://blockchain:8545
      - DEPLOYMENTS_PATH=/shared/deployments.json
      - ARTIFACTS_PATH=/shared/artifacts
    volumes:
      - shared-data:/shared
    depends_on:
      contract-setup:
        condition: service_completed_successfully

  oracle-1:
    build: ./backend
    command: npm run start:oracle
    environment:
      - NETWORK=localhost
      - RPC_URL=http://blockchain:8545
      - ORACLE_PRIVATE_KEY=${HARDHAT_ORACLE_1_KEY}
      - DEPLOYMENTS_PATH=/shared/deployments.json
      - ARTIFACTS_PATH=/shared/artifacts
    volumes:
      - shared-data:/shared
    depends_on:
      wot-network:
        condition: service_started
      contract-setup:
        condition: service_completed_successfully

  oracle-2:
    build: ./backend
    command: npm run start:oracle
    environment:
      - NETWORK=localhost
      - RPC_URL=http://blockchain:8545
      - ORACLE_PRIVATE_KEY=${HARDHAT_ORACLE_2_KEY}
      - DEPLOYMENTS_PATH=/shared/deployments.json
      - ARTIFACTS_PATH=/shared/artifacts
    volumes:
      - shared-data:/shared
    depends_on:
      wot-network:
        condition: service_started
      contract-setup:
        condition: service_completed_successfully
  
  oracle-3:
    build: ./backend
    command: npm run start:oracle
    environment:
      - NETWORK=localhost
      - RPC_URL=http://blockchain:8545
      - ORACLE_PRIVATE_KEY=${HARDHAT_ORACLE_3_KEY}
      - DEPLOYMENTS_PATH=/shared/deployments.json
      - ARTIFACTS_PATH=/shared/artifacts
    volumes:
      - shared-data:/shared
    depends_on:
      wot-network:
        condition: service_started
      contract-setup:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    volumes:
      - shared-data:/usr/share/nginx/html/assets
    depends_on:
      contract-setup:
        condition: service_completed_successfully
      api:
        condition: service_started